{% extends "./plantillaPrin.html" %}
{% block contenido %}
<div class="container">
<br>
<h1><b>{{ salon.nombre }}</b></h1>
<p><b>Capacidad:</b> {{ salon.capacidad }} personas</p>

</div>
<br><br><br>
{% endblock %}
