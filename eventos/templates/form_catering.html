{% extends "./plantillaPrin.html" %}
{% block contenido %}
<div class="container" style="padding-top: 40px;">
<div class="row">
<div class="col-md-2"></div>
<div class="col-md-8">
<h1><b>{% if proveedor %}Editar{% else %}Nuevo{% endif %} Proveedor de Catering</b></h1>
<hr>

<form id="form_catering" method="post">
    {% csrf_token %}
<div class="form-group">
<label><b>Nombre de la empresa: <span class="text-danger">*</span></b></label>
<input class="form-control" type="text" name="nombre_empresa" id="nombre_empresa"
value="{{ proveedor.nombre_empresa|default:'' }}" placeholder="Ej: Delicias Gourmet S.A.">
</div>
<div class="form-row">
<div class="form-group col-md-6">
<label><b>Persona de contacto: <span class="text-danger">*</span></b></label>
<input class="form-control" type="text" name="contacto" id="contacto"
value="{{ proveedor.contacto|default:'' }}" placeholder="Nombre completo">
</div>
<div class="form-group col-md-6">
<label><b>Teléfono: <span class="text-danger">*</span></b></label>
<input class="form-control" type="text" name="telefono" id="telefono"
maxlength="10" inputmode="numeric"
value="{{ proveedor.telefono|default:'' }}" placeholder="0991234567">
</div>
</div>
<div class="form-group">
<label><b>Especialidad: <span class="text-danger">*</span></b></label>
<input class="form-control" type="text" name="especialidad" id="especialidad"
value="{{ proveedor.especialidad|default:'' }}" placeholder="Ej: comida gourmet, bocaditos, bar">
</div>
<div class="form-group">
<label><b>Precio por persona ($): <span class="text-danger">*</span></b></label>
<input class="form-control" type="number" step="0.01" name="precio_por_persona" id="precio_por_persona"
value="{{ proveedor.precio_por_persona|default:'' }}" min="0.01" max="1000">
</div>
<div class="form-check mb-3">
<input class="form-check-input" type="checkbox" name="activo" id="activo"
{% if proveedor.activo or not proveedor %}checked{% endif %}>
<label class="form-check-label" for="activo">Disponible para asignar a eventos</label>
</div>

<button class="btn btn-success" type="submit">
<i class="fa fa-save"></i> Guardar
</button>
<a href="{% url 'listado_catering_admin' %}" class="btn btn-secondary">
<i class="fa fa-times"></i> Cancelar
</a>
</form>
<br>
</div>
</div>
</div>

<style>
label.error{
    color: #dc3545;
    font-size: 13px;
    font-weight: 500;
    display: block;
    margin-top: 4px;
}
.form-control.error{
    border-color: #dc3545;
}
</style>
{% endblock %}

{% block scripts %}
<script>
$(document).ready(function() {

    $.validator.addMethod('telefonoEcuador', function(value, element) {
        return this.optional(element) || /^[0-9]{10}$/.test(value);
    }, 'El teléfono debe tener exactamente 10 dígitos.');

    $.validator.addMethod('soloLetras', function(value, element) {
        return this.optional(element) || /^[A-Za-zÁÉÍÓÚáéíóúÑñ\s]+$/.test(value);
    }, 'Solo se permiten letras y espacios.');

    // Bloquea teclas no numéricas mientras se escribe el teléfono
    $('#telefono').on('keypress', function(e) {
        const tecla = e.which || e.keyCode;
        if (tecla < 48 || tecla > 57) {
            e.preventDefault();
        }
    });

    $('#form_catering').validate({
        errorElement: 'label',
        errorPlacement: function(error, element) {
            error.insertAfter(element);
        },
        highlight: function(element) {
            $(element).addClass('error');
        },
        unhighlight: function(element) {
            $(element).removeClass('error');
        },
        rules: {
            nombre_empresa: { required: true, minlength: 2, maxlength: 150 },
            contacto: { required: true, soloLetras: true, minlength: 2, maxlength: 100 },
            telefono: { required: true, telefonoEcuador: true },
            especialidad: { required: true, minlength: 3, maxlength: 150 },
            precio_por_persona: { required: true, number: true, min: 0.01, max: 1000 }
        },
        messages: {
            nombre_empresa: {
                required: 'El nombre de la empresa es obligatorio.',
                minlength: 'Mínimo 2 caracteres.',
                maxlength: 'Máximo 150 caracteres.'
            },
            contacto: {
                required: 'El nombre del contacto es obligatorio.',
                minlength: 'Mínimo 2 caracteres.'
            },
            telefono: {
                required: 'El teléfono es obligatorio.'
            },
            especialidad: {
                required: 'La especialidad es obligatoria.',
                minlength: 'Describe brevemente la especialidad (mín. 3 caracteres).'
            },
            precio_por_persona: {
                required: 'El precio es obligatorio.',
                min: 'Debe ser mayor a cero.',
                max: 'El precio parece demasiado alto, verifica el valor.'
            }
        }
    });
});
</script>
{% endblock %}
