{% extends "./plantillaPrin.html" %}
{% block contenido %}
<div class="container" style="padding-top: 40px;">
<div class="row">
<div class="col-md-2"></div>
<div class="col-md-8">
<h1><b>{% if equipo %}Editar{% else %}Nuevo{% endif %} Equipo Audiovisual</b></h1>
<hr>

<form id="form_equipo" method="post">
    {% csrf_token %}
<div class="form-group">
<label><b>Nombre del equipo: <span class="text-danger">*</span></b></label>
<input class="form-control" type="text" name="nombre" id="nombre"
value="{{ equipo.nombre|default:'' }}" placeholder="Ej: Proyector Epson EB-X41">
</div>
<div class="form-row">
<div class="form-group col-md-6">
<label><b>Categoría: <span class="text-danger">*</span></b></label>
<select class="form-control" name="categoria" id="categoria">
<option value="" disabled {% if not equipo %}selected{% endif %}>Selecciona...</option>
                {% for valor, etiqueta in categorias %}
<option value="{{ valor }}" {% if equipo.categoria == valor %}selected{% endif %}>{{ etiqueta }}</option>
                {% endfor %}
</select>
</div>
<div class="form-group col-md-3">
<label><b>Cantidad total: <span class="text-danger">*</span></b></label>
<input class="form-control" type="number" name="cantidad_total" id="cantidad_total"
value="{{ equipo.cantidad_total|default:'' }}" min="1" max="500" step="1" placeholder="Ej: 5">
</div>
<div class="form-group col-md-3">
<label><b>Precio/evento ($): <span class="text-danger">*</span></b></label>
<input class="form-control" type="number" step="0.01" name="precio_unitario" id="precio_unitario"
value="{{ equipo.precio_unitario|default:'' }}" min="0.01" max="10000">
</div>
</div>
<div class="form-check mb-3">
<input class="form-check-input" type="checkbox" name="activo" id="activo"
{% if equipo.activo or not equipo %}checked{% endif %}>
<label class="form-check-label" for="activo">Disponible para asignar a eventos</label>
</div>

<button class="btn btn-success" type="submit">
<i class="fa fa-save"></i> Guardar
</button>
<a href="{% url 'listado_equipos_admin' %}" class="btn btn-secondary">
<i class="fa fa-times"></i> Cancelar
</a>
</form>
<br>
</div>
</div>
</div>

<style>
label.error{
    color: #dc3545;
    font-size: 13px;
    font-weight: 500;
    display: block;
    margin-top: 4px;
}
.form-control.error{
    border-color: #dc3545;
}
</style>
{% endblock %}

{% block scripts %}
<script>
$(document).ready(function() {

    // Regla personalizada: solo números enteros (sin decimales) para cantidad
    $.validator.addMethod("soloEnteros", function(value, element) {
        return this.optional(element) || /^\d+$/.test(value);
    }, "La cantidad debe ser un número entero, sin decimales.");

    // Regla personalizada: nombre no puede ser solo espacios o solo símbolos
    $.validator.addMethod("nombreValido", function(value, element) {
        return this.optional(element) || /[A-Za-zÁÉÍÓÚáéíóúÑñ0-9]/.test(value);
    }, "Ingresa un nombre válido para el equipo.");

    $('#form_equipo').validate({
        errorElement: 'label',
        errorPlacement: function(error, element) {
            error.insertAfter(element);
        },
        highlight: function(element) {
            $(element).addClass('error');
        },
        unhighlight: function(element) {
            $(element).removeClass('error');
        },
        rules: {
            nombre: { required: true, minlength: 2, maxlength: 100, nombreValido: true },
            categoria: { required: true },
            cantidad_total: { required: true, soloEnteros: true, min: 1, max: 500 },
            precio_unitario: { required: true, number: true, min: 0.01, max: 10000 }
        },
        messages: {
            nombre: {
                required: 'El nombre es obligatorio.',
                minlength: 'Mínimo 2 caracteres.',
                maxlength: 'Máximo 100 caracteres.'
            },
            categoria: {
                required: 'Selecciona una categoría.'
            },
            cantidad_total: {
                required: 'La cantidad es obligatoria.',
                soloEnteros: 'Ingresa un número entero (sin decimales).',
                min: 'Mínimo 1 unidad.',
                max: 'Máximo 500 unidades. Si tienes más, contacta soporte.'
            },
            precio_unitario: {
                required: 'El precio es obligatorio.',
                number: 'Ingresa solo números.',
                min: 'Debe ser mayor a cero.',
                max: 'El precio parece demasiado alto, verifica el valor.'
            }
        }
    });
});
</script>
{% endblock %}
